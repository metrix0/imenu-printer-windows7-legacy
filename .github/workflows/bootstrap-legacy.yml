name: Bootstrap Legacy Printer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: windows-2022

    steps:
      - name: Checkout legacy repository
        uses: actions/checkout@v4

      - name: Check whether bootstrap is needed
        shell: pwsh
        run: |
          if (Test-Path "main.cjs") {
            "NEEDS_BOOTSTRAP=false" >> $env:GITHUB_ENV
          } else {
            "NEEDS_BOOTSTRAP=true" >> $env:GITHUB_ENV
          }

      - name: Checkout current iMenu printer
        if: env.NEEDS_BOOTSTRAP == 'true'
        uses: actions/checkout@v4
        with:
          repository: metrix0/imenu-printer
          ref: d9d528a4d44b9e91cbfaa88faae632204daea238
          path: source

      - name: Copy current printer source
        if: env.NEEDS_BOOTSTRAP == 'true'
        shell: pwsh
        run: |
          Copy-Item "source/.gitignore" ".gitignore" -Force
          Copy-Item "source/config.json" "config.json" -Force
          Copy-Item "source/index.html" "index.html" -Force
          Copy-Item "source/main.cjs" "main.cjs" -Force
          Copy-Item "source/preload.cjs" "preload.cjs" -Force
          Copy-Item "source/receipt-settings.js" "receipt-settings.js" -Force
          Remove-Item "source" -Recurse -Force

      - name: Apply Windows 7 and 8 compatibility changes
        if: env.NEEDS_BOOTSTRAP == 'true'
        shell: pwsh
        run: |
          $content = Get-Content "main.cjs" -Raw
          $content = $content.Replace("const { SerialPort } = require('serialport')", "const SerialPort = require('serialport')")
          $content = $content.Replace("Get-Printer | Select-Object Name,PortName | ConvertTo-Json -Compress", "Get-WmiObject Win32_Printer | Select-Object Name,PortName | ConvertTo-Json -Compress")
          $content = $content -replace "new SerialPort\(\{\r?\n\s*path: config\.PRINTER_COM_PORT,", "new SerialPort(config.PRINTER_COM_PORT, {"
          $content = $content.Replace('const versionLabel = `Versão ${app.getVersion()}`', 'const versionLabel = `Versão ${app.getVersion()} Legacy`')
          [IO.File]::WriteAllText((Join-Path $PWD "main.cjs"), $content, [Text.UTF8Encoding]::new($false))

      - name: Setup Node
        if: env.NEEDS_BOOTSTRAP == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python 3.11
        if: env.NEEDS_BOOTSTRAP == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure node-gyp Python
        if: env.NEEDS_BOOTSTRAP == 'true'
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" >> $env:GITHUB_ENV
          "npm_config_python=$python" >> $env:GITHUB_ENV

      - name: Install dependencies
        if: env.NEEDS_BOOTSTRAP == 'true'
        run: npm install

      - name: Build legacy installer
        if: env.NEEDS_BOOTSTRAP == 'true'
        run: npm run dist -- --publish never

      - name: Save installer artifact
        if: env.NEEDS_BOOTSTRAP == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: imenu-printer-windows7-legacy-1.1.5
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Commit legacy source
        if: env.NEEDS_BOOTSTRAP == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore config.json index.html main.cjs preload.cjs receipt-settings.js package-lock.json
          git commit -m "Add Windows 7 and 8 legacy printer [legacy-bootstrap]"
          git push
